name: Publish radar

"on":
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site_changed: ${{ steps.site_changes.outputs.changed }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Test generator
        run: python3 -m unittest discover -s tests -v

      - name: Refresh from the official feed
        if: github.event_name != 'schedule' || vars.AUTOPUBLISH != 'false'
        run: python3 radar.py

      - name: Detect public site changes
        id: site_changes
        run: |
          changed=false
          if [[ -n "$(git status --porcelain -- output)" ]]; then
            changed=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]] && ! git diff --quiet HEAD^ HEAD -- output; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit a new release
        if: github.event_name != 'schedule' || vars.AUTOPUBLISH != 'false'
        run: |
          if git diff --quiet -- state output; then
            echo "No release changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state output
          git commit -m "chore: update AI coding release radar"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Check out IndexNow submitter
        if: needs.build.outputs.site_changed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Notify IndexNow
        if: needs.build.outputs.site_changed == 'true'
        continue-on-error: true
        run: |
          key=$(python3 -c 'import radar; print(radar.INDEXNOW_KEY)')
          for attempt in {1..12}; do
            if [[ "$(curl --fail --silent --show-error "https://ai-coding-radar.github.io/$key.txt")" == "$key" ]]; then
              python3 submit_indexnow.py
              exit
            fi
            sleep 5
          done
          echo "IndexNow key is not public after deployment." >&2
          exit 1
