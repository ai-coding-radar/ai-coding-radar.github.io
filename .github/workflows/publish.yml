name: Publish radar

"on":
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test generator
        run: python3 -m unittest discover -s tests -v

      - name: Refresh from the official feed
        if: github.event_name != 'schedule' || vars.AUTOPUBLISH == 'true'
        run: python3 radar.py

      - name: Commit a new release
        if: github.event_name != 'schedule' || vars.AUTOPUBLISH == 'true'
        run: |
          if git diff --quiet -- state output; then
            echo "No release changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state output
          git commit -m "chore: update Codex release radar"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
