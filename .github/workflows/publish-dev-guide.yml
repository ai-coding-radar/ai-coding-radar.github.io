name: Publish tested guide on DEV

"on":
  schedule:
    - cron: "20 1 * * *"
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      guide:
        description: Tested guide to create, verify, or publish
        required: true
        default: oss-security
        type: choice
        options:
          - oss-security
          - uk-supplier-monitor
          - markdown-image-automation
          - grants-gov-monitor
          - remote-ai-jobs
      publish:
        description: Publish publicly instead of creating or reusing a draft
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-dev-guide
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Publish at most one due queued guide
        if: github.event_name == 'schedule'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python3 devto_guide.py --publish-next-due

      - name: Create, verify, or publish a selected DEV guide
        if: github.event_name == 'workflow_dispatch'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          PUBLISH: ${{ inputs.publish }}
          GUIDE: ${{ inputs.guide }}
        run: |
          args=(--guide "$GUIDE")
          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi
          python3 devto_guide.py "${args[@]}"
